apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-config
  namespace: ticketmei
data:
  PAYMENT_DB_PATH: /data/payment.db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: payment-data
  namespace: ticketmei
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: ticketmei
  labels:
    app: payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
        - name: payment
          image: ghcr.io/pedrogoncalves00/ticketmei-payment:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: payment-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: payment-data
              mountPath: /data
      volumes:
        - name: payment-data
          persistentVolumeClaim:
            claimName: payment-data
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: ticketmei
spec:
  type: ClusterIP
  selector:
    app: payment
  ports:
    - name: http
      port: 8004
      targetPort: 8004

apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: ticketmei
data:
  NOTIFICATION_DB_PATH: /data/notifications.db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: ticketmei
  labels:
    app: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification
          image: ghcr.io/pedrogoncalves00/ticketmei-notification:1ebcaa3c1529f80e0e457638b12af7ebbb6a576c
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: notification-config
          env:
            - name: RABBITMQ_USER
              valueFrom:
                configMapKeyRef:
                  name: rabbitmq-config
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_PASS
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/%2F
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: notification-data
              mountPath: /data
      volumes:
        - name: notification-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: ticketmei
spec:
  selector:
    app: notification
  ports:
    - port: 8003
      targetPort: 8003

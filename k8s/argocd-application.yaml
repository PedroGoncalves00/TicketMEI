apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ticketmei-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/PedroGoncalves00/TicketMEI.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: ticketmei
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
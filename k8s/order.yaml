apiVersion: v1
kind: ConfigMap
metadata:
  name: order-config
  namespace: ticketmei
data:
  CATALOG_URL: http://catalog:8001
  ORDER_DB_PATH: /data/orders.db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: ticketmei
  labels:
    app: order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
        - name: order
          image: ghcr.io/pedrogoncalves00/ticketmei-order:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: order-config
          env:
            - name: RABBITMQ_USER
              valueFrom:
                configMapKeyRef:
                  name: rabbitmq-config
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_PASS
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/%2F
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: order-data
              mountPath: /data
      volumes:
        - name: order-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: ticketmei
spec:
  selector:
    app: order
  ports:
    - port: 8002
      targetPort: 8002

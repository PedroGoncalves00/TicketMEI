global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['api-gateway:8000']
  - job_name: catalog
    metrics_path: /metrics
    static_configs:
      - targets: ['catalog:8001']
  - job_name: order
    metrics_path: /metrics
    static_configs:
      - targets: ['order:8002']
  - job_name: notification
    metrics_path: /metrics
    static_configs:
      - targets: ['notification:8003']
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ['rabbitmq:15692']

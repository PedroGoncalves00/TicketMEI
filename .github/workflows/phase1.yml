name: TicketMEI - Fase 1
on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: |
          python -m pip install -r catalog/requirements.txt -r api-gateway/requirements.txt pytest
      - name: Testes automáticos
        run: python -m pytest -q tests

  docker-and-k6:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe do Compose
        run: docker compose config --quiet
      - name: Construir e iniciar serviços
        run: docker compose up -d --build --wait catalog api-gateway prometheus grafana
      - name: Validar endpoints e métricas
        run: |
          curl --fail --silent http://localhost:8000/events > /dev/null
          curl --fail --silent http://localhost:8000/events/evt-101 > /dev/null
          curl --fail --silent http://localhost:8001/metrics | grep catalog_requests_total > /dev/null
          curl --fail --silent http://localhost:8000/metrics | grep gateway_requests_total > /dev/null
      - name: k6 - teste curto automatizado
        run: docker compose --profile testing run --rm k6 run smoke-test.js
      - name: Estado e logs (em falha)
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=100
      - name: Parar e limpar
        if: always()
        run: docker compose --profile testing down -v --remove-orphans

name: TicketMEI - CI/CD Kubernetes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install             -r catalog/requirements.txt             -r api-gateway/requirements.txt             -r order/requirements.txt             -r notification/requirements.txt             pytest

      - name: Executar testes
        run: python -m pytest -q tests

  build-and-push:
    name: Build e push - ${{ matrix.service }}
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: catalog
            context: ./catalog
          - service: order
            context: ./order
          - service: notification
            context: ./notification
          - service: api-gateway
            context: ./api-gateway
          - service: rabbitmq
            context: ./rabbitmq

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar nome da imagem
        id: image
        shell: bash
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=${REGISTRY}/${OWNER_LC}/ticketmei-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push com Git SHA
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

  update-manifests:
    name: Atualizar tags Kubernetes
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Atualizar imagens para o Git SHA
        shell: bash
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          BASE="${REGISTRY}/${OWNER_LC}"

          sed -i -E "s#image: ghcr.io/.*/ticketmei-catalog:.*#image: ${BASE}/ticketmei-catalog:${GITHUB_SHA}#" k8s/catalog.yaml
          sed -i -E "s#image: ghcr.io/.*/ticketmei-order:.*#image: ${BASE}/ticketmei-order:${GITHUB_SHA}#" k8s/order.yaml
          sed -i -E "s#image: ghcr.io/.*/ticketmei-notification:.*#image: ${BASE}/ticketmei-notification:${GITHUB_SHA}#" k8s/notification.yaml
          sed -i -E "s#image: ghcr.io/.*/ticketmei-api-gateway:.*#image: ${BASE}/ticketmei-api-gateway:${GITHUB_SHA}#" k8s/api-gateway.yaml
          sed -i -E "s#image: ghcr.io/.*/ticketmei-rabbitmq:.*#image: ${BASE}/ticketmei-rabbitmq:${GITHUB_SHA}#" k8s/rabbitmq.yaml

      - name: Commit dos manifestos atualizados
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nao existem alteracoes nos manifestos."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/catalog.yaml k8s/order.yaml k8s/notification.yaml k8s/api-gateway.yaml k8s/rabbitmq.yaml
          git commit -m "ci: update Kubernetes images to ${GITHUB_SHA} [skip ci]"
          git push origin main

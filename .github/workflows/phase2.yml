name: TicketMEI - Fase 2
on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          python -m pip install -r catalog/requirements.txt -r api-gateway/requirements.txt -r order/requirements.txt -r notification/requirements.txt pytest
      - name: Testes Python
        run: python -m pytest -q tests

  docker-e2e:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar Compose
        run: docker compose config --quiet
      - name: Iniciar o ambiente
        run: docker compose up -d --build --wait catalog rabbitmq order notification api-gateway prometheus grafana
      - name: Testar endpoints e fluxo OrderCreated
        run: python scripts/e2e_phase2.py
      - name: Executar k6 - Fase 2
        run: docker compose --profile testing run --rm k6 run smoke-order.js
      - name: Evidencias (falha)
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=120
      - name: Limpar
        if: always()
        run: docker compose --profile testing down -v --remove-orphans

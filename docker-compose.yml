networks:
  ticketmei-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  redis_data:
  rabbitmq_data:

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ticketmei
      RABBITMQ_DEFAULT_PASS: ticketmei_dev
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ticketmei-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ticketmei-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  catalog:
    build: ./catalog
    container_name: catalog
    ports:
      - "8001:8001"
    networks:
      - ticketmei-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  order:
    build: ./order
    container_name: order
    ports:
      - "8002:8002"
    environment:
      RABBITMQ_URL: amqp://ticketmei:ticketmei_dev@rabbitmq:5672/%2F
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ticketmei-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification:
    build: ./notification
    container_name: notification
    ports:
      - "8003:8003"
    environment:
      RABBITMQ_URL: amqp://ticketmei:ticketmei_dev@rabbitmq:5672/%2F
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ticketmei-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      CATALOG_URL: http://catalog:8001
      ORDER_URL: http://order:8002
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_REQUESTS: 5
      RATE_LIMIT_WINDOW: 1
    depends_on:
      catalog:
        condition: service_healthy
      order:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ticketmei-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - ticketmei-net

  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - ticketmei-net

  k6:
    image: grafana/k6:0.49.0
    container_name: k6
    working_dir: /ci-scripts
    volumes:
      - ./k6:/ci-scripts:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - ticketmei-net
    profiles:
      - testing


